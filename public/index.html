<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Card Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1:#18213b; --bg2:#0e1426; --bg3:#080c18;
    --gold:#c9a96a; --gold-hi:#e8d3a2; --gold-lo:#8d7442;
    --ivory:#fafaf7; --ink:#14161f; --red:#c23b4a;
    --glass:rgba(255,255,255,.045); --line:rgba(255,255,255,.1); --green:#6fcf97;
    --serif:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  html { background: var(--bg3); }
  * { box-sizing: border-box; }
  body { margin:0; font-family: var(--serif); font-size:15px; color:#f4ead2; min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,169,106,.14), transparent 55%),
      radial-gradient(circle at 50% 40%, var(--bg1), var(--bg2) 60%, var(--bg3)); background-attachment: fixed; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-weight:600; font-size: 22px; letter-spacing: 6px; text-transform: uppercase; text-align:center; margin: 6px 0 22px; color: var(--gold-hi); }
  h1::before, h1::after { content:''; display:inline-block; width: 36px; height:1px; background: var(--gold-lo); vertical-align: middle; margin: 0 16px; }

  button { font-family: var(--display); font-size: 13px; letter-spacing: .4px; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight:600;
    color:#1a1407; border: 0; background: linear-gradient(180deg, var(--gold-hi), var(--gold));
    box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: filter .15s, transform .15s; }
  button:hover { filter: brightness(1.06); transform: translateY(-1px); }
  button.ghost { background: rgba(255,255,255,.06); color: #e9ecf5; border: 1px solid var(--line); box-shadow: none; }
  button.ghost:hover { background: rgba(255,255,255,.12); }
  button:disabled { opacity:.5; cursor: default; }
  input { font-family: var(--serif); font-size: 16px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); width: 100%;
    background: rgba(255,255,255,.07); color: #fff; outline: none; }
  input::placeholder { color: rgba(255,255,255,.45); }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,169,106,.25); }
  input[type=checkbox] { accent-color: var(--gold); }

  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); backdrop-filter: blur(6px); }
  .lobby { max-width: 400px; margin: 30px auto; display: grid; gap: 12px; padding: 26px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
  .grow { flex:1; }
  .err { color:#ff9c8f; min-height: 1.2em; }
  .code { font-family: var(--display); font-size: 28px; letter-spacing: 6px; font-weight: 700; color: var(--gold-hi); margin-left: 8px; }
  .name { font-weight: 600; font-size: 15px; color: #fff; margin-bottom: 10px; }
  .hint { font-size: 13px; opacity: .6; margin-top: 12px; text-align:center; }
  .tag { font-size: 10px; font-weight:600; letter-spacing: .8px; text-transform: uppercase; background: rgba(201,169,106,.18); color: var(--gold-hi); border: 1px solid var(--gold-lo); border-radius: 99px; padding: 2px 9px; margin-left: 8px; vertical-align: middle; }
  label.peek { font-size: 13px; opacity:.85; display: inline-flex; gap: 6px; align-items: center; }

  /* ---- cards ---- */
  .card { position: relative; width: 58px; height: 84px; border-radius: 7px; user-select:none; cursor:pointer; overflow: hidden;
    background: var(--ivory); color: var(--ink); border: 1px solid #dcdcd2; border-radius: 9px;
    box-shadow: 0 4px 12px rgba(0,0,0,.45);
    font-family: var(--display); transition: transform .12s, box-shadow .12s; border-radius: 9px; }
  .card:hover { box-shadow: 0 8px 18px rgba(0,0,0,.55); }
  .card.red { color: var(--red); }
  .card .ix { position:absolute; top:5px; left:6px; display:flex; flex-direction:column; align-items:center; font-weight:700; font-size:16px; line-height:1; }
  .card .ix i { font-style: normal; font-size: 15px; margin-top:2px; }
  .card .pip { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: 34px; padding-top: 14px; padding-left: 8px; opacity:.9; }
  .card.sel { transform: translateY(-8px); box-shadow: 0 0 0 2px var(--gold), 0 12px 20px rgba(0,0,0,.55); }
  .card.mine { touch-action: none; cursor: grab; }

  /* card back: midnight navy with a fine gold diamond lattice */
  .card.back, .card.down {
    color: transparent; cursor: default; border: 1px solid var(--gold-lo);
    background:
      repeating-linear-gradient(45deg, rgba(201,169,106,.28) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(-45deg, rgba(201,169,106,.28) 0 1px, transparent 1px 8px),
      linear-gradient(160deg, #26345c, #121a33);
    box-shadow: 0 4px 12px rgba(0,0,0,.45), inset 0 0 0 4px #121a33, inset 0 0 0 5px rgba(201,169,106,.7);
  }
  .card.mine.down { cursor: grab; }
  .card.down .ix, .card.down .pip { opacity: 0; }
  .card.down.peek .ix, .card.down.peek .pip { opacity: .75; }
  .card.down.peek { color: #fff; }
  .card.down.peek.red { color: #ff9b94; }

  .slot { width: 58px; height: 84px; border-radius: 9px; display:flex;
    background: rgba(255,255,255,.04); border: 1px dashed rgba(201,169,106,.55); }
  .slot.target { border-style: solid; border-color: var(--gold); background: rgba(201,169,106,.12); box-shadow: 0 0 14px rgba(201,169,106,.35); cursor: pointer; }
  .slot.over { border-style: solid; border-color: var(--green); background: rgba(111,207,151,.18); box-shadow: 0 0 14px rgba(111,207,151,.4); }
  .slot .card { width:100%; height:100%; margin:0; }
  .panel.over { outline: 2px dashed var(--green); outline-offset: 4px; }

  .board { display:flex; flex-direction:column; gap:10px; align-items:center; padding: 6px 0; }
  .board .r { display:flex; gap:10px; }
  .rw { position: relative; width: 100%; display: flex; justify-content: center; }
  .rowbtn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); padding: 5px 10px; font-size: 10px; }
  .hand { display:flex; gap:10px; flex-wrap: wrap; min-height: 90px; justify-content:center; padding: 8px 0; }

  .others { display:grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap:16px; }
  .others .panel { margin-bottom: 0; padding: 12px; }
  .others .card, .others .slot { width: 36px; height: 52px; border-radius: 6px; }
  .others .card .ix { top:3px; left:3px; font-size: 11px; } .others .card .ix i { font-size: 10px; margin-top: 1px; }
  .others .card .pip { font-size: 20px; padding-top: 10px; padding-left: 4px; }
  .others .board, .others .board .r { gap: 5px; }

  .ghost-card { position: fixed; pointer-events: none; z-index: 99; opacity: .95; transform: translate(-50%,-50%) scale(1.1) rotate(-3deg); box-shadow: 0 14px 26px rgba(0,0,0,.65) !important; }
  .dragging-src { opacity: .3; }
  @media (max-width: 520px) { h1 { font-size: 18px; letter-spacing: 3px; } h1::before, h1::after { margin: 0 6px; } .rowbtn { position: static; transform: none; margin-left: 8px; } .rw { justify-content: center; align-items: center; } }
</style>
</head>
<body>
<main>
  <h1>Seven Card Table</h1>
  <div id="app"></div>
</main>
<script>
const SUIT = { S:'♠', H:'♥', D:'♦', C:'♣' };
const ROWS = [1, 1, 2, 3];
const POLL_MS = 1500;
const app = document.getElementById('app');
let session = load();   // {code, pid}
let st = null;          // latest server view
let selected = null;    // selected card id in my hand
let err = '';
let timer = null;
let lastKey = '';
let peek = false;

function load() { try { return JSON.parse(localStorage.getItem('sct') || 'null'); } catch { return null; } }
function save() { try { session ? localStorage.setItem('sct', JSON.stringify(session)) : localStorage.removeItem('sct'); } catch {} }

async function api(action, extra = {}) {
  const r = await fetch('/api/game', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...(session || {}), ...extra }),
  });
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error || 'Error'), { status: r.status });
  return j;
}

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e[k] = v;
  }
  for (const k of kids) e.append(k);
  return e;
}

// A card on screen. info: {src:'hand'|slot index} makes it draggable (own cards only).
function cardEl(id, { up = true, src = null, onclick = null, extra = '' } = {}) {
  if (id === '?') return el('div', { class: 'card back' });
  const suit = id.slice(-1), rank = id.slice(0, -1);
  const red = suit === 'H' || suit === 'D';
  const cls = ['card', red ? 'red' : '', extra];
  if (!up) cls.push('down');
  if (!up && peek) cls.push('peek');   // optional: owner can peek at own face-down cards
  if (src !== null) cls.push('mine');
  const e = el('div', { class: cls.join(' ') }, el('div', { class: 'ix' }, rank, el('i', {}, SUIT[suit])), el('div', { class: 'pip' }, SUIT[suit]));
  if (src !== null) enableDrag(e, src, id, onclick);
  return e;
}

// ---- pointer-based drag & drop (works with mouse and touch) ----
let dragging = false;
function enableDrag(node, src, cardId, onTap) {
  node.addEventListener('pointerdown', (ev) => {
    if (ev.button !== undefined && ev.button !== 0) return;
    const sx = ev.clientX, sy = ev.clientY;
    let ghost = null, over = null;
    const target = (x, y) => {
      const t = document.elementFromPoint(x, y);
      const hit = t && (t.closest('[data-slot]') || t.closest('[data-hand]'));
      if (hit) return hit;
      // dropped in a gap: snap to the nearest slot within 50px
      let best = null, bd = 50;
      document.querySelectorAll('[data-slot]').forEach((n) => {
        const r = n.getBoundingClientRect();
        const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
        if (d < bd) { bd = d; best = n; }
      });
      return best;
    };
    const move = (e) => {
      if (!ghost) {
        if (Math.hypot(e.clientX - sx, e.clientY - sy) < 6) return;
        dragging = true;
        ghost = node.cloneNode(true);
        ghost.classList.add('ghost-card');
        document.body.append(ghost);
        node.classList.add('dragging-src');
      }
      ghost.style.left = e.clientX + 'px';
      ghost.style.top = e.clientY + 'px';
      const t = target(e.clientX, e.clientY);
      if (t !== over) { over?.classList.remove('over'); over = t; over?.classList.add('over'); }
    };
    const up = (e) => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (!ghost) return onTap && onTap();           // plain tap
      const t = target(e.clientX, e.clientY);
      ghost.remove(); over?.classList.remove('over'); node.classList.remove('dragging-src');
      dragging = false;
      if (e.type === 'pointercancel' || !t) return render();
      drop(src, cardId, t);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}

function drop(src, cardId, t) {
  selected = null;
  if (t.dataset.hand !== undefined) {
    if (src === 'hand') return render();
    return act('unplace', { slot: src });
  }
  const to = Number(t.dataset.slot);
  if (src === 'hand') return act('place', { card: cardId, slot: to });
  if (src === to) return render();
  return act('move', { from: src, to });
}

function boardEl(board, mine) {
  const wrap = el('div', { class: 'board' });
  let i = 0;
  for (const [rowIdx, n] of ROWS.entries()) {
    const row = el('div', { class: 'r' });
    const rw = el('div', { class: 'rw' }, row);
    for (let k = 0; k < n; k++, i++) {
      const slot = i, s = board[slot];
      const editable = mine && st.phase === 'dealt';
      let cls = 'slot', inner = '';
      if (s) {
        inner = cardEl(s.c, editable
          ? { up: s.up, src: slot, onclick: () => act('flip', { slot }) }
          : { up: s.up });
      } else if (editable && selected) cls += ' target';
      const node = el('div', { class: cls }, inner);
      if (mine) node.dataset.slot = slot;
      if (editable && selected) node.onclick = () => { const card = selected; selected = null; act('place', { card, slot }); };
      row.append(node);
    }
    if (mine && st.phase === 'dealt') {
      rw.append(el('button', { class: 'ghost rowbtn', title: 'Flip this row face up', onclick: () => act('flipRowUp', { row: rowIdx }) }, 'Flip up'));
    }
    wrap.append(rw);
  }
  return wrap;
}

function render() {
  app.replaceChildren();
  if (!session || !st) return renderLobby();
  const me = st.players.find(p => p.id === st.meId);

  const head = el('div', { class: 'panel row' },
    el('div', {}, 'Room ', el('span', { class: 'code' }, st.code)),
    el('div', { class: 'grow' }, `${st.players.length}/5 players` + (st.round ? ` · round ${st.round}` : '')),
    el('button', { class: 'ghost', onclick: leave }, 'Leave'));
  if (st.isHost) {
    const dealBtn = el('button', { onclick: () => act('deal') },
      st.phase === 'lobby' ? 'Shuffle & deal' : 'Reset, shuffle & deal');
    head.insertBefore(dealBtn, head.lastChild);
  }
  app.append(head);
  if (err) app.append(el('div', { class: 'err' }, err));

  if (st.phase === 'lobby') {
    app.append(el('div', { class: 'panel' },
      el('div', { class: 'name' }, 'Waiting for players…'),
      el('div', {}, st.players.map(p => p.name + (p.isHost ? ' (host)' : '')).join(', ')),
      el('p', {}, st.isHost ? 'Share the room code, then press “Shuffle & deal” when everyone has joined.' : 'Waiting for the host to deal.')));
    return;
  }

  app.append(el('div', { class: 'panel' },
    el('div', { class: 'row' },
      el('div', { class: 'name grow' }, `${me.name} (you)`, me.isHost ? el('span', { class: 'tag' }, 'host') : ''),
      el('label', { class: 'peek' }, el('input', { type: 'checkbox', checked: peek, style: 'width:auto', onchange: (e) => { peek = e.target.checked; render(); } }), 'Peek at my face-down cards'),
      el('button', { onclick: () => act('flipAllDown') }, 'Flip all face down')),
    boardEl(me.board, true),
    el('div', { class: 'hint' }, 'Drag cards between slots or back to your hand. Click a card on the board to flip it face up/down — others only see face-up cards. Each row has a “Flip up” button.')));

  const hand = el('div', { class: 'hand' });
  st.hand.forEach(c => hand.append(cardEl(c, {
    src: 'hand',
    extra: c === selected ? 'sel' : '',
    onclick: () => { selected = selected === c ? null : c; render(); },
  })));
  const handPanel = el('div', { class: 'panel' },
    el('div', { class: 'name' }, 'Your hand — drag a card onto a slot (or tap it, then tap a slot)'), hand);
  handPanel.dataset.hand = '';
  app.append(handPanel);

  const others = el('div', { class: 'others' });
  st.players.filter(p => p.id !== st.meId).forEach(p => others.append(el('div', { class: 'panel' },
    el('div', { class: 'name' }, p.name, p.isHost ? el('span', { class: 'tag' }, 'host') : '', ` · ${p.handCount} in hand`),
    boardEl(p.board, false))));
  if (others.children.length) app.append(others);
}

function renderLobby() {
  const name = el('input', { placeholder: 'Your name', maxLength: 16, value: localStorage.getItem('sct-name') || '' });
  const code = el('input', { placeholder: 'Room code', maxLength: 4, style: 'text-transform:uppercase' });
  const remember = () => { try { localStorage.setItem('sct-name', name.value); } catch {} };
  app.append(el('div', { class: 'panel lobby' },
    name,
    el('button', { onclick: () => { remember(); enter('create', { name: name.value }); } }, 'Create room (you are host)'),
    el('div', { class: 'row' }, el('div', { class: 'grow' }, code),
      el('button', { onclick: () => { remember(); enter('join', { name: name.value, code: code.value }); } }, 'Join')),
    el('div', { class: 'err' }, err)));
}

async function enter(action, body) {
  err = '';
  try {
    session = null;
    adopt(await api(action, body));
    session = { code: st.code, pid: st.meId };
    save(); startPolling();
  } catch (e) { err = e.message; }
  render();
}

// Only accept state that is at least as new as what we already show, so a slow
// poll response can't roll the board back after a move.
function adopt(j) {
  if (st && st.code === j.code && j.version < st.version) return false;
  st = j; lastKey = JSON.stringify(j);
  if (selected && !st.hand.includes(selected)) selected = null;
  return true;
}

async function act(action, extra = {}) {
  err = '';
  try { adopt(await api(action, extra)); }
  catch (e) { err = e.message; }
  render();
}

async function leave() {
  try { await api('leave'); } catch {}
  session = null; st = null; selected = null; save(); clearInterval(timer); render();
}

async function poll() {
  if (!session) return;
  try {
    const r = await fetch(`/api/game?code=${session.code}&pid=${session.pid}`);
    const j = await r.json();
    if (r.status === 404) { session = null; st = null; save(); clearInterval(timer); err = 'Room no longer available'; return render(); }
    if (!r.ok || dragging) return;
    if (j.version < (st?.version ?? 0) || JSON.stringify(j) === lastKey) return;
    adopt(j);
    err = '';
    render();
  } catch {}
}

function startPolling() { clearInterval(timer); timer = setInterval(poll, POLL_MS); }

if (session) { poll().then(() => { if (session) startPolling(); }); } 
render();
</script>
</body>
</html>
